# Warehouse: ClickHouse (bronze → silver → consistent → gold → marts) and its scheduled jobs
services:
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:25.8
    container_name: cdc-clickhouse
    hostname: clickhouse
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - 127.0.0.1:8123:8123   # HTTP interface (Play UI at /play)
      - 127.0.0.1:9000:9000   # native protocol (clickhouse-client)
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # config.d/storage.xml takes the S3 keys from the environment: exported from the secret files here, so they
    # exist only inside the process, never in the container's configuration
    entrypoint: ["/bin/bash", "-c", "export COLD_STORAGE_ACCESS_KEY=$$(cat /run/secrets/cold_storage_access_key) COLD_STORAGE_SECRET_KEY=$$(cat /run/secrets/cold_storage_secret_key); exec /entrypoint.sh"]
    volumes:
      - ../secrets/clickhouse_password:/run/secrets/clickhouse_password:ro
      - ../secrets/grafana_reader_password:/run/secrets/grafana_reader_password:ro
      - ../secrets/monitor_password:/run/secrets/monitor_password:ro
      - ../secrets/cold_storage_access_key:/run/secrets/cold_storage_access_key:ro
      - ../secrets/cold_storage_secret_key:/run/secrets/cold_storage_secret_key:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password $$(cat /run/secrets/clickhouse_password) --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Scheduled warehouse jobs (marts, business-day close, reconciliation); each run pins one watermark
  warehouse-jobs:
    restart: unless-stopped
    build: ./jobs
    container_name: cdc-warehouse-jobs
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      PG_HOST: postgres            # read-only, for reconciliation
      PG_USER: app_reader
      PG_PASSWORD_FILE: /run/secrets/app_reader_password
      JOB_INTERVAL_S: 5
      MART_REFRESH_S: 15
      RECONCILE_S: 30
    volumes:
      - ../secrets/clickhouse_password:/run/secrets/clickhouse_password:ro
      - ../secrets/app_reader_password:/run/secrets/app_reader_password:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # S3-compatible object store for bronze's cold volume (stands in for S3 / GCS); internal only
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.47
    container_name: cdc-seaweedfs
    hostname: seaweedfs
    entrypoint: ["/bin/sh", "/seaweedfs-start.sh"]
    volumes:
      - ../secrets/cold_storage_access_key:/run/secrets/cold_storage_access_key:ro
      - ../secrets/cold_storage_secret_key:/run/secrets/cold_storage_secret_key:ro
      - ./seaweedfs-start.sh:/seaweedfs-start.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.bucket-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  clickhouse_data:
  seaweedfs_data:
