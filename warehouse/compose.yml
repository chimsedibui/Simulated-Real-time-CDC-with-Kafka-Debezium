# Warehouse: ClickHouse (bronze → silver → consistent → gold → marts) and its scheduled jobs
services:
  clickhouse:
    restart: unless-stopped
    image: clickhouse/clickhouse-server:25.8
    container_name: cdc-clickhouse
    hostname: clickhouse
    depends_on:
      kafka:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - 8123:8123   # HTTP interface (Play UI at /play)
      - 9000:9000   # native protocol (clickhouse-client)
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env, see .env.example}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?set it in .env, see .env.example}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?set it in .env, see .env.example}
      COLD_STORAGE_ACCESS_KEY: ${COLD_STORAGE_ACCESS_KEY:?set it in .env, see .env.example}
      COLD_STORAGE_SECRET_KEY: ${COLD_STORAGE_SECRET_KEY:?set it in .env, see .env.example}
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Scheduled warehouse jobs (marts, business-day close, reconciliation); each run pins one watermark
  warehouse-jobs:
    restart: unless-stopped
    build: ./jobs
    container_name: cdc-warehouse-jobs
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env, see .env.example}
      PG_HOST: postgres            # read-only, for reconciliation
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      JOB_INTERVAL_S: 5
      MART_REFRESH_S: 15
      RECONCILE_S: 30
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # S3-compatible object store for bronze's cold volume (stands in for S3 / GCS); internal only
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.47
    container_name: cdc-seaweedfs
    hostname: seaweedfs
    environment:
      COLD_STORAGE_ACCESS_KEY: ${COLD_STORAGE_ACCESS_KEY:?set it in .env, see .env.example}
      COLD_STORAGE_SECRET_KEY: ${COLD_STORAGE_SECRET_KEY:?set it in .env, see .env.example}
    entrypoint: ["/bin/sh", "/seaweedfs-start.sh"]
    volumes:
      - ./seaweedfs-start.sh:/seaweedfs-start.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.bucket-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  clickhouse_data:
  seaweedfs_data:
