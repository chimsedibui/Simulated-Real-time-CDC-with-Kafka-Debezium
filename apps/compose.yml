# Applications: the CDC Control Center (simulator control, live CDC feed; analytics live in Grafana)
services:
  control-center:
    restart: unless-stopped
    build:
      context: ..                            # needs debezium/postgres-connector.json as well
      dockerfile: apps/control-center/Dockerfile
    container_name: cdc-control-center
    ports:
      - 127.0.0.1:8000:8000
    environment:
      PG_HOST: postgres            # read-only queries for health
      PG_PORT: 5432
      PG_USER: app_reader
      PG_PASSWORD_FILE: /run/secrets/app_reader_password
      PG_DB: enterprise_db
      KAFKA_BROKER: kafka:9092
      DEBEZIUM_URL: http://debezium:8083
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      PII_SALT_FILE: /run/secrets/pii_salt       # filled into the connector config on register
      SIMULATOR_URL: http://simulator:8200
      SOURCE_API_URL: http://source-api:8100
    volumes:
      - ../secrets/app_reader_password:/run/secrets/app_reader_password:ro
      - ../secrets/clickhouse_password:/run/secrets/clickhouse_password:ro
      - ../secrets/pii_salt:/run/secrets/pii_salt:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      simulator:
        condition: service_started
