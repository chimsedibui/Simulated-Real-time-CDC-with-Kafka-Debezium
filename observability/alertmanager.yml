global:
  resolve_timeout: 5m
route:
  receiver: google-chat
  group_by: [alertname, job, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: google-chat
    webhook_configs:
      - url: http://chat-webhook:8080/alerts
        send_resolved: true
        max_alerts: 15
inhibit_rules:
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname!="TargetDown"']
    equal: [job, instance]
