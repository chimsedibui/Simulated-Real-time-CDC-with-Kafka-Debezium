global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: realtime-cdc
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: platform
    static_configs: [{targets: ["platform-exporter:9108"]}]
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: source-api
    static_configs: [{targets: ["source-api:8100"]}]
  - job_name: identity
    static_configs: [{targets: ["identity:8300"]}]
  - job_name: chat-webhook
    static_configs: [{targets: ["chat-webhook:8080"]}]
  - job_name: warehouse-jobs
    static_configs: [{targets: ["warehouse-jobs:9109"]}]
