groups:
  - name: cdc-platform
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})'
          description: 'Metrics scraping failed for at least 2 minutes. Check the target endpoint, exporter logs and network; scrape failure alone does not prove the application stopped.'
          condition: 'up == 0 for 2m'
          observed_value: '{{ $value }}'
      - alert: DependencyDown
        expr: cdc_dependency_up == 0 or cdc_service_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'CDC dependency is unhealthy'
          description: 'Dependency {{ $labels.dependency }} / service {{ $labels.service }} failed checks. Inspect logs and database connectivity.'
      - alert: ConnectorNotRunning
        expr: cdc_connect_running == 0 and on() cdc_dependency_up{dependency="debezium"} == 1
        for: 2m
        labels: {severity: critical, service: debezium}
        annotations:
          summary: 'Debezium connector/task is not RUNNING'
          description: 'Inspect Connect task errors and replication slot health; "Schema being registered is incompatible" means the Schema Registry blocked a breaking source change (runbook in the README). Increasing consumers will not fix a stopped connector.'
      - alert: CDCLagHigh
        expr: cdc_ingest_lag_p95_seconds > 5 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 10m
        labels: {severity: warning, service: clickhouse, slo: freshness}
        annotations:
          summary: 'CDC p95 ingestion lag is above the 5-second freshness SLO'
          description: 'Allowed up to 30 s during an 11.11 peak. Check Kafka backlog, Debezium lag, ClickHouse memory and merges.'
      - alert: CDCLagCritical
        expr: cdc_ingest_lag_p95_seconds > 30 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 5m
        labels: {severity: critical, service: clickhouse, slo: freshness}
        annotations:
          summary: 'CDC p95 ingestion lag is above 30 seconds, the peak freshness SLO'
          description: 'Compare Debezium behind-source time with Kafka consumer lag to find the slow stage before adding capacity.'
      - alert: DebeziumBehindSource
        expr: cdc_debezium_behind_source_seconds > 10 and on() cdc_dependency_up{dependency="debezium-jmx"} == 1
        for: 5m
        labels: {severity: warning, service: debezium}
        annotations:
          summary: 'Debezium is more than 10 seconds behind PostgreSQL'
          description: 'Check the change queue, producer throughput and Kafka. Retained WAL grows while this lasts.'
      - alert: DebeziumQueueFilling
        expr: cdc_debezium_queue_remaining_ratio < 0.2 and on() cdc_dependency_up{dependency="debezium-jmx"} == 1
        for: 5m
        labels: {severity: warning, service: debezium}
        annotations:
          summary: 'Debezium change queue is over 80% full'
          description: 'Kafka is not keeping up with the connector. Inspect broker health and producer settings (R10).'
      - alert: KafkaBacklogGrowing
        expr: sum by(consumergroup) (kafka_consumergroup_lag) > 10000 and sum by(consumergroup) (deriv(kafka_consumergroup_lag[10m])) > 0
        for: 5m
        labels: {severity: warning, service: kafka}
        annotations:
          summary: 'Consumer backlog is growing: {{ $labels.consumergroup }}'
          description: 'Backlog exceeds 10k messages and is growing. Compare ingress and processing rates; inspect partitions before adding consumers.'
      - alert: TransactionWatermarkStalled
        expr: cdc_oldest_held_transaction_age_seconds > 120 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 2m
        labels: {severity: critical, service: warehouse}
        annotations:
          summary: 'Transaction watermark is held back'
          description: 'A transaction has not fully landed for over 2 minutes. Inspect individual topic ingestion and ingest errors.'
      - alert: MartRefreshStale
        expr: time() - cdc_mart_last_success_timestamp_seconds > 120 and on() increase(cdc_events_total[5m]) > 0 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 2m
        labels: {severity: warning, service: warehouse-jobs}
        annotations:
          summary: 'Mart refresh is stale while CDC is active'
          description: 'Inspect warehouse-jobs logs, refresh duration and watermark. Business dashboards may show old data.'
      - alert: ReconciliationStale
        expr: time() - cdc_reconciliation_last_success_timestamp_seconds > 180 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 3m
        labels: {severity: warning, service: warehouse-jobs}
        annotations:
          summary: 'Scheduled reconciliation has stopped'
          description: 'No recent reconciliation execution. Inspect warehouse-jobs and source connectivity.'
      - alert: WarehouseDataDrift
        expr: cdc_reconciliation_failing_tables > 0 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        for: 2m
        labels: {severity: critical, service: warehouse}
        annotations:
          summary: 'Source and warehouse disagree in consecutive checks'
          description: 'Inspect ops.reconciliation_status. Resolve ingestion/schema issues before backfilling affected tables.'
      - alert: IngestErrors
        expr: increase(cdc_ingest_errors_total[10m]) > 0 and on() cdc_dependency_up{dependency="clickhouse"} == 1
        labels: {severity: critical, service: clickhouse}
        annotations:
          summary: 'ClickHouse quarantined new ingestion errors'
          description: 'Inspect bronze.ingest_errors and correct the data contract before replay.'
      - alert: PostgresWALRetained
        expr: cdc_postgres_slot_retained_wal_bytes > 1073741824
        for: 5m
        labels: {severity: warning, service: postgres}
        annotations:
          summary: 'Replication slot retains over 1 GiB of WAL'
          description: 'Check connector progress and free disk space. Do not delete replication slots as a first response.'
      - alert: PostgresSlotWALAtRisk
        expr: cdc_postgres_slot_safe_wal_bytes < 2147483648
        for: 2m
        labels: {severity: critical, service: postgres}
        annotations:
          summary: 'Replication slot {{ $labels.slot }} is within 2 GiB of being invalidated'
          description: 'Past max_slot_wal_keep_size PostgreSQL drops the WAL the connector still needs, and Debezium must snapshot again. Restore connector progress now.'
      - alert: PostgresSlotLost
        expr: cdc_postgres_slot_wal_reserved == 0
        labels: {severity: critical, service: postgres}
        annotations:
          summary: 'Replication slot {{ $labels.slot }} has lost or unreserved WAL'
          description: 'Changes may be missing from the warehouse. Re-snapshot through the signal table and run reconciliation.'
      - alert: PostgresSlotMissing
        expr: absent(cdc_postgres_slot_wal_reserved{slot="debezium_slot"}) and on() cdc_dependency_up{dependency="postgres"} == 1
        for: 2m
        labels: {severity: critical, service: postgres, slot: debezium_slot}
        annotations:
          summary: 'Replication slot debezium_slot does not exist'
          description: 'After a failover or a dropped slot Debezium may create a new one at the current LSN and skip changes silently. Re-snapshot through the signal table and run reconciliation.'
      - alert: PostgresConnectionsHigh
        expr: cdc_postgres_connections / cdc_postgres_max_connections > 0.8
        for: 5m
        labels: {severity: warning, service: postgres}
        annotations:
          summary: 'PostgreSQL connections exceed 80% capacity'
          description: 'Inspect idle sessions, pool configuration and lock waits before adding API replicas.'
      - alert: PostgresDeadlocks
        expr: increase(cdc_postgres_deadlocks_total[5m]) > 0
        labels: {severity: warning, service: postgres}
        annotations:
          summary: 'PostgreSQL detected a deadlock'
          description: 'Inspect PostgreSQL logs and command lock ordering.'
      - alert: APIErrorRateHigh
        expr: sum(rate(http_requests_total{job="source-api",status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{job="source-api"}[5m])),0.001) > 0.05
        for: 5m
        labels: {severity: warning, service: source-api}
        annotations:
          summary: 'Source API 5xx error rate exceeds 5%'
          description: 'Inspect database pool saturation, locks and request failures.'
      - alert: APILatencyHigh
        expr: histogram_quantile(0.95,sum by(le)(rate(http_request_duration_highr_seconds_bucket{job="source-api"}[5m]))) > 2
        for: 5m
        labels: {severity: warning, service: source-api}
        annotations:
          summary: 'Source API p95 latency exceeds 2 seconds'
          description: 'Check DB lock waits and CPU saturation. Scale API only when the application tier is the bottleneck.'
      - alert: LoginFailuresHigh
        expr: sum(rate(identity_logins_total{outcome=~"failed|locked"}[5m])) > 1 and sum(rate(identity_logins_total{outcome=~"failed|locked"}[5m])) > 0.5 * sum(rate(identity_logins_total[5m]))
        for: 10m
        labels: {severity: warning, service: identity}
        annotations:
          summary: 'Most logins are failing or hitting locked accounts'
          description: 'Possible credential stuffing. Inspect identity audit (identity_db.audit) by client IP before blocking.'
      - alert: CheckoutLatencyHigh
        expr: histogram_quantile(0.99, sum by(le)(rate(http_request_duration_seconds_bucket{job="source-api",handler=~"(/v1)?/checkouts",method="POST"}[5m]))) > 0.3 and on() sum(rate(http_request_duration_seconds_count{job="source-api",handler=~"(/v1)?/checkouts",method="POST"}[5m])) > 0.1
        for: 10m
        labels: {severity: warning, service: source-api, slo: write-path}
        annotations:
          summary: 'Checkout p99 latency is above the 300 ms SLO'
          description: 'Inspect lock waits on SKU, flash-sale and voucher rows and the connection pool.'
      - alert: DashboardQuerySlow
        expr: cdc_clickhouse_select_p95_seconds{user="grafana_reader"} > 0.5
        for: 10m
        labels: {severity: warning, service: clickhouse, slo: dashboard}
        annotations:
          summary: 'Dashboard queries p95 is above the 500 ms SLO'
          description: 'Check mart sizes, ClickHouse memory and merges, and concurrent refresh load.'
      - alert: ClickHousePartsHigh
        expr: max by(database, table)(cdc_clickhouse_max_parts_per_partition) > 300
        for: 10m
        labels: {severity: warning, service: clickhouse}
        annotations:
          summary: 'ClickHouse table {{ $labels.database }}.{{ $labels.table }} has over 300 parts in one partition'
          description: 'Inserts are too small or merges are behind; ClickHouse refuses inserts with TOO_MANY_PARTS near 3000 (R18).'
      - alert: KafkaUnderReplicated
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 5m
        labels: {severity: critical, service: kafka}
        annotations:
          summary: 'Kafka has under-replicated partitions'
          description: 'A broker is down or lagging; with RF=1 this cannot happen, with RF=3 a further broker loss risks data.'
      - alert: HostCPUHigh
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels: {severity: warning, service: host}
        annotations:
          summary: 'Host CPU exceeds 85% for 10 minutes'
          description: 'Correlate with traffic, backlog and latency. Consider more compute if throughput is saturated.'
      - alert: HostMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels: {severity: warning, service: host}
        annotations:
          summary: 'Host memory usage exceeds 90%'
          description: 'Inspect ClickHouse memory and application usage before increasing concurrency.'
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15 and node_filesystem_readonly == 0
        for: 5m
        labels: {severity: critical, service: host}
        annotations:
          summary: 'Less than 15% disk space remains'
          description: 'Inspect WAL retention, Kafka retention and warehouse growth.'
      - alert: ChatDeliveryFailed
        expr: increase(chat_webhook_deliveries_total{result="error"}[5m]) > 0
        for: 1m
        labels: {severity: warning, service: chat-webhook}
        annotations:
          summary: 'Google Chat notification delivery failed'
          description: 'Inspect bridge connectivity and webhook credentials. Alertmanager retries failed deliveries; check its UI if Chat is unavailable.'
      - alert: CollectorStalled
        expr: time() - cdc_dependency_last_success_timestamp_seconds > 120
        for: 2m
        labels: {severity: critical, service: platform-exporter}
        annotations:
          summary: 'Dependency metrics have stopped updating'
          description: 'Inspect platform-exporter and dependency query timeouts. Successful HTTP scrapes do not guarantee fresh SQL metrics.'
      - alert: WarehouseJobsFailing
        expr: increase(warehouse_job_errors_total[5m]) >= 3
        for: 1m
        labels: {severity: warning, service: warehouse-jobs}
        annotations:
          summary: 'Warehouse jobs are repeatedly failing'
          description: 'Inspect warehouse-jobs logs and database connectivity; published marts are preserved during reconnect.'
