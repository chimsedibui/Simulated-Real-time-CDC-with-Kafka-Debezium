rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="kafka",instance="kafka-exporter:9308"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {job: kafka, instance: 'kafka-exporter:9308', severity: critical}
            exp_annotations:
              summary: 'Metrics target kafka is unreachable'
              description: 'Check the service and exporter connectivity. Inspect Platform Health before restarting.'
  - interval: 1m
    input_series:
      - series: 'cdc_mart_last_success_timestamp_seconds'
        values: '1+0x10'
      - series: 'cdc_events_total'
        values: '100+0x10'
      - series: 'cdc_dependency_up{dependency="clickhouse"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: MartRefreshStale
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'cdc_connect_running{connector="postgres-connector",component="task-0"}'
        values: '0+0x5'
      - series: 'cdc_dependency_up{dependency="debezium"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnectorNotRunning
        exp_alerts:
          - exp_labels: {connector: postgres-connector, component: task-0, severity: critical, service: debezium}
            exp_annotations:
              summary: 'Debezium connector/task is not RUNNING'
              description: 'Inspect Connect task errors and replication slot health; "Schema being registered is incompatible" means the Schema Registry blocked a breaking source change (runbook in the README). Increasing consumers will not fix a stopped connector.'
  - interval: 1m
    input_series:
      - series: 'cdc_ingest_errors_total'
        values: '5x15 8x30'
      - series: 'cdc_dependency_up{dependency="clickhouse"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 14m
        alertname: IngestErrors
        exp_alerts: []
      - eval_time: 17m
        alertname: IngestErrors
        exp_alerts:
          - exp_labels: {severity: critical, service: clickhouse}
            exp_annotations:
              summary: 'ClickHouse quarantined new ingestion errors'
              description: 'Inspect bronze.ingest_errors and correct the data contract before replay.'
      - eval_time: 30m
        alertname: IngestErrors
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'cdc_postgres_slot_safe_wal_bytes{slot="debezium_slot"}'
        values: '8589934592x3 1073741824x5'
      - series: 'cdc_postgres_slot_wal_reserved{slot="debezium_slot"}'
        values: '1x5 0x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresSlotWALAtRisk
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresSlotWALAtRisk
        exp_alerts:
          - exp_labels: {slot: debezium_slot, severity: critical, service: postgres}
            exp_annotations:
              summary: 'Replication slot debezium_slot is within 2 GiB of being invalidated'
              description: 'Past max_slot_wal_keep_size PostgreSQL drops the WAL the connector still needs, and Debezium must snapshot again. Restore connector progress now.'
      - eval_time: 7m
        alertname: PostgresSlotLost
        exp_alerts:
          - exp_labels: {slot: debezium_slot, severity: critical, service: postgres}
            exp_annotations:
              summary: 'Replication slot debezium_slot has lost or unreserved WAL'
              description: 'Changes may be missing from the warehouse. Re-snapshot through the signal table and run reconciliation.'
  - interval: 1m
    input_series:
      - series: 'cdc_clickhouse_select_p95_seconds{user="grafana_reader"}'
        values: '0.05x5 0.9x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: DashboardQuerySlow
        exp_alerts: []
      - eval_time: 18m
        alertname: DashboardQuerySlow
        exp_alerts:
          - exp_labels: {user: grafana_reader, severity: warning, service: clickhouse, slo: dashboard}
            exp_annotations:
              summary: 'Dashboard queries p95 is above the 500 ms SLO'
              description: 'Check mart sizes, ClickHouse memory and merges, and concurrent refresh load.'
  - interval: 1m
    input_series:
      - series: 'cdc_dependency_up{dependency="postgres"}'
        values: '1x6'
      - series: 'cdc_postgres_slot_wal_reserved{slot="debezium_slot"}'
        values: '1 1 stale'
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresSlotMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: PostgresSlotMissing
        exp_alerts:
          - exp_labels: {severity: critical, service: postgres, slot: debezium_slot}
            exp_annotations:
              summary: 'Replication slot debezium_slot does not exist'
              description: 'After a failover or a dropped slot Debezium may create a new one at the current LSN and skip changes silently. Re-snapshot through the signal table and run reconciliation.'
