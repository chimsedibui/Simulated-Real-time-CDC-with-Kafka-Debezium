apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      # The plugin defaults (50 open / 25 idle) queue a dashboard opened by many viewers at once
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 300
      username: grafana_reader
      defaultDatabase: mart
      tlsSkipVerify: false
    secureJsonData:
      password: $__file{/run/secrets/grafana_reader_password}
    editable: false
