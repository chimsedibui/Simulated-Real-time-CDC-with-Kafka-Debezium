services:
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin  
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: enterprise_db
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgres/data:/var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - real-time-cdc-network
  
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: 2qSwnJXZRt-pVWxfonRqtQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - real-time-cdc-network
  
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: cdc-debezium
    hostname: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium-config
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - real-time-cdc-network
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc-kafka-ui
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - real-time-cdc-network

  adminer:
    image: adminer:latest
    container_name: cdc-adminer
    ports:
      - 8081:8080
    networks:
      - real-time-cdc-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: cdc-clickhouse
    hostname: clickhouse
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 8123:8123   # HTTP interface (Play UI at /play)
      - 9000:9000   # native protocol (clickhouse-client)
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config.d/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password admin --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - real-time-cdc-network

  # The only writer to PostgreSQL: business commands, outbox events, idempotency
  source-api:
    build: ./source_api
    container_name: cdc-source-api
    hostname: source-api
    ports:
      - 8100:8100   # OpenAPI docs at /docs
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: admin
      PG_PASSWORD: admin
      PG_DB: enterprise_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - real-time-cdc-network

  # Simulated users and external systems; changes data only through the Source API
  simulator:
    build: ./simulator
    container_name: cdc-simulator
    hostname: simulator
    ports:
      - 8200:8200
    environment:
      SOURCE_API_URL: http://source-api:8100
      SIM_SCALE: ${SIM_SCALE:-medium}
      SIM_AUTO_SEED: ${SIM_AUTO_SEED:-true}
      SIM_SPEED: ${SIM_SPEED:-240}           # business clock speed (×wall clock)
    depends_on:
      source-api:
        condition: service_healthy
    networks:
      - real-time-cdc-network

  # Scheduled warehouse jobs (marts, business-day close, reconciliation); each run pins one watermark
  warehouse-jobs:
    build: ./warehouse_jobs
    container_name: cdc-warehouse-jobs
    environment:
      CLICKHOUSE_HOST: clickhouse
      PG_HOST: postgres            # read-only, for reconciliation
      JOB_INTERVAL_S: 5
      MART_REFRESH_S: 15
      RECONCILE_S: 30
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - real-time-cdc-network

  # On-demand checks: `docker compose run --rm validator pytest -q` / `... python check_data.py`
  validator:
    build: ./validation
    profiles: ["tools"]
    environment:
      SOURCE_API_URL: http://source-api:8100
      PG_HOST: postgres
      CLICKHOUSE_HOST: clickhouse
    networks:
      - real-time-cdc-network

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: cdc-webapp
    ports:
      - 8000:8000
    environment:
      PG_HOST: postgres            # read-only queries for health
      PG_PORT: 5432
      PG_USER: admin
      PG_PASSWORD: admin
      PG_DB: enterprise_db
      KAFKA_BROKER: kafka:9092
      DEBEZIUM_URL: http://debezium:8083
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      SIMULATOR_URL: http://simulator:8200
      SOURCE_API_URL: http://source-api:8100
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      simulator:
        condition: service_started
    networks:
      - real-time-cdc-network

volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  
networks:
  real-time-cdc-network:
    driver: bridge
