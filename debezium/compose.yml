# Change data capture: Kafka Connect with the Debezium PostgreSQL connector (config: postgres-connector.json)
services:
  debezium:
    restart: unless-stopped
    image: debezium/connect:2.7.3.Final
    container_name: cdc-debezium
    hostname: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium-config
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      # Connector configs read secrets as ${dir:/run/secrets:<file>}, so the password is never in the stored config
      CONNECT_CONFIG_PROVIDERS: dir
      CONNECT_CONFIG_PROVIDERS_DIR_CLASS: org.apache.kafka.common.config.provider.DirectoryConfigProvider
      # JMX over HTTP (Jolokia, port 8778) for the platform exporter; not published to the host
      ENABLE_JOLOKIA: "true"
    volumes:
      - ../secrets/cdc_db_password:/run/secrets/cdc_db_password:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
