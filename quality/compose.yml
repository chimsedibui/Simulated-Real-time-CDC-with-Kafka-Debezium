# Quality: API and stress tests, data checks, torn-read probe (on demand, profile "tools"); gates: quality/gate.sh
services:
  validator:
    build: .
    profiles: ["tools"]
    environment:
      SOURCE_API_URL: http://source-api:8100
      PG_HOST: postgres
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env, see .env.example}
